name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build web bundle
        run: npx expo export --platform web --output-dir dist-web

      - name: Build iOS bundle
        run: npx expo export --platform ios --output-dir dist-ios

  # Regenerates src/types/db.ts from the linked Supabase schema and fails if it
  # drifts from what is committed. Skipped automatically unless the repo has the
  # SUPABASE_ACCESS_TOKEN secret and SUPABASE_PROJECT_ID variable configured.
  types-drift:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    defaults:
      run:
        working-directory: app
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Link Supabase project
        run: npx supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"

      - name: Regenerate types
        run: npm run gen:types

      - name: Fail if src/types/db.ts is out of date
        run: |
          if ! git diff --quiet -- src/types/db.ts; then
            echo '::error::src/types/db.ts is out of date. Run: npm run gen:types'
            git diff -- src/types/db.ts
            exit 1
          fi
